<!DOCTYPE html>

<html lang="pt-br">

<head>

  <meta charset="UTF-8" />

  <title>ConnectHub</title>

  <style>

    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; }

    #lista { list-style: none; padding: 0; }

    #lista li {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 0.75rem 1rem;

      margin-bottom: 0.5rem;

      border: 1px solid #ddd;

      border-radius: 8px;

    }

    .info { display: flex; flex-direction: column; }

    .categoria { font-size: 0.75rem; color: #888; }

    .estrela {

      font-size: 1.5rem;

      cursor: pointer;

      background: none;

      border: none;

      line-height: 1;

    }

    .estrela.favoritado { color: gold; }

    .estrela.favoritado::before { content: "★"; }

    .estrela:not(.favoritado) { color: #ccc; }

    .estrela:not(.favoritado)::before { content: "☆"; }

  </style>

</head>

<body>

  <h1>📋 ConnectHub</h1>

  <form id="meuFormulario">
    <input type="hidden" id="id" name="id">

    <div>
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" required>
    </div>
 
    <form id="meuFormulario">
      
    <input type="hidden" id="id" name="id">

    <div>
        <label for="telefone">Telefone *</label>
        <input type="tel" id="telefone" name="telefone" required>
    </div>

    <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">
    </div>

    <div>
        <label for="categoria">Categoria *</label>
        <select id="categoria" name="categoria" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="amigo">Amigo</option>
            <option value="trabalho">Trabalho</option>
            <option value="familia">Família</option>
            <option value="outro">Outro</option>
        </select>
    </div>

    <button type="submit">Salvar Contato</button>
</form>

  <ul id="lista"></ul>

  <script type="module" src="contatos.js"></script>

</body>

</html>
